<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FineRP - Помилка{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/a4fda1df64.js" crossorigin="anonymous"></script>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .error-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-code {
      font-size: 120px;
      font-weight: bold;
      color: #dc3545;
      line-height: 1;
      margin-bottom: 0;
    }
    .error-divider {
      width: 3px;
      height: 100px;
      background-color: #dee2e6;
      margin: 0 30px;
    }
    .error-details {
      max-width: 500px;
    }
    .error-icon {
      font-size: 48px;
      color: #dc3545;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">FineRP</a>
    </div>
  </nav>

  <!-- Error Content -->
  <div class="error-container">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-4 text-center">
          <h1 class="error-code">{% block error_code %}404{% endblock %}</h1>
        </div>
        <div class="d-none d-md-block">
          <div class="error-divider"></div>
        </div>
        <div class="col-md-7">
          <div class="error-details">
            <div class="error-icon">
              <i class="fas {% block error_icon %}fa-exclamation-triangle{% endblock %}"></i>
            </div>
            <h2>{% block error_title %}Помилка{% endblock %}</h2>
            <p class="lead">
              {% block error_message %}
              На жаль, сталася помилка.
              {% endblock %}
            </p>
            <div class="mt-4">
              <a href="/" class="btn btn-primary">
                <i class="fas fa-home me-2"></i> На головну
              </a>
              <button onclick="history.back()" class="btn btn-outline-secondary ms-2">
                <i class="fas fa-arrow-left me-2"></i> Назад
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light py-4">
    <div class="container text-center">
      <p class="text-muted mb-0">© {% now "Y" %} FineRP. Всі права захищено.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
